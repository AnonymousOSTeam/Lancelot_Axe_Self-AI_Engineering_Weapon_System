name: Release Lancelot Axe SC3DR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          # Compila o Raylib diretamente da fonte no runner se não houver pacote binário apt pronto
          git clone --depth 1 https://github.com/raysan5/raylib.git /tmp/raylib
          cd /tmp/raylib/src
          make PLATFORM=PLATFORM_DESKTOP
          sudo make install PLATFORM=PLATFORM_DESKTOP

      - name: Build Project
        run: |
          make clean
          make

      - name: Create Release Package
        run: |
          mkdir -p release_dist
          cp bin/gui_launcher release_dist/ 2>/dev/null || true
          cp bin/cli_tests release_dist/ 2>/dev/null || true
          tar -czvf lancelot_axe_release.tar.gz -C release_dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lancelot_axe_release.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
