name: Release Lancelot Axe SC3DR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libraylib-dev libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Build Project
        run: |
          make clean
          make

      - name: Create Release Package
        run: |
          mkdir -p release_dist
          cp bin/gui_launcher release_dist/
          cp bin/cli_tests release_dist/
          tar -czvf lancelot_axe_release.tar.gz -C release_dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: lancelot_axe_release.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
