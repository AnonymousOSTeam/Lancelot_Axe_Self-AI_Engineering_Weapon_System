name: Aggressive Automated Release

on:
  push:
    branches:
      - master
    paths:
      - 'VERSION.md'
      - 'src/**'
      - 'include/**'
      - '.github/workflows/release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: fedora:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Ferramentas de Compilação no Fedora
        run: dnf install -y gcc make findutils git

      - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies (Raylib)
      run: |
        sudo apt-get update
        sudo apt-get install -y libraylib-dev libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libgl1-mesa-dev

    - name: Compilar Projeto C
      run: make

      - name: Extrair Número da Versão do VERSION.md
        id: parse_version
        run: |
          VERSION_NUM=$(grep -m 1 "^# Version" VERSION.md | awk '{print $3}')
          echo "VERSION=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "Versão detectada: $VERSION_NUM"

      - name: Verificação e Criação de Tag Git
        id: tag_check
        run: |
          TAG_NAME="v${{ steps.parse_version.outputs.VERSION }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "A tag $TAG_NAME já existe. Pulando a criação de release."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            echo "Nova versão detectada: $TAG_NAME"
          fi

      - name: Publicar Release no GitHub
        if: steps.tag_check.outputs.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.parse_version.outputs.VERSION }}
          body_path: VERSION.md
          files: bin/system_core
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
