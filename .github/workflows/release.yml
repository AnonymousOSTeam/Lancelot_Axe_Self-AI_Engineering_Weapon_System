name: Aggressive Automated Release

on:
  push:
    branches:
      - master
    paths:
      - 'VERSION.md'
      - 'src/**'
      - 'include/**'

jobs:
  release:
    runs-on: fedora-workstation-44
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compilar Projeto C
        run: make

      - name: Extrair Número da Versão do VERSION.md
        id:
        run: |
          # Extrai a versão da linha "# Version 2.0.0"
          VERSION_NUM=$(grep -m 1 "^# Version" VERSION.md | awk '{print $3}')
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "Versão detectada: $VERSION_NUM"

     - name: Verificação e Criação de Tag Git
       id: tag_check
       run: |
          TAG_NAME="v${{ steps.parse_version.outputs.VERSION }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "A tag $TAG_NAME já existe. Pulando a criação de release."
          else:
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            echo "Nova versão detectada: $TAG_NAME"
          fi:
     - name: Publicar Release no GitHub
       if: steps.tag_check.outputs.TAG_EXISTS == 'false'
       uses: softprops/action-gh-release@v1
       with:
         tag_name: v${{ steps.parse_version.outputs.VERSION }}
         body_path: VERSION.md
         files: bin/system_core
         draft: false
         prerelease: false
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


