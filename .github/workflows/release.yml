name: Release Lancelot Axe SC3DR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Dependencias do Sistema
        run: dnf install -y gcc make findutils git raylib-devel libX11-devel libXrandr-devel libXinerama-devel libXi-devel libXcursor-devel mesa-libGL-devel

      - name: Compilar Projeto C
        run: make

      - name: Extrair Versao
        id: parse_version
        run: |
          VERSION=$(cat VERSION.md | head -n 1 | tr -d '\n\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Empacotar Executavel
        run: |
          mkdir -p release_package
          cp bin/gui_launcher release_package/lancelot_axe_sc3dr 2>/dev/null || cp bin/* release_package/ 2>/dev/null || true
          tar -czvf lancelot_axe_fedora.tar.gz -C release_package .

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: lancelot_axe_fedora.tar.gz
          name: Lancelot Axe SC3DR ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
